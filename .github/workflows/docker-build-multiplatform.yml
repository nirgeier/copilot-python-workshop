env:
  BACKEND_PORT: 3000
  BASE_IMAGE: ubuntu:22.04
  CONTAINER_NAME: copilot-python-workshop
  FRONTEND_PORT: 4200
  IMAGE_NAME: nirgeier/copilot-python-workshop
  NODE_VERSION: 20
  REGISTRY: docker.io
  REPO_BRANCH: Docker
  REPO_URL: https://github.com/nirgeier/copilot-python-workshop.git
  VERSION: 1.0

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Set up QEMU (for multi-arch emulation)
        uses: docker/setup-qemu-action@v2

      - if: github.event_name != 'pull_request'
        name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          password: ${{ secrets.DOCKER_PASSWORD }}
          username: ${{ secrets.DOCKER_USERNAME }}

      - id: meta
        name: Extract Docker metadata
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=ref,event=tag
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,prefix={{branch}}-

      - name: Build and push multi-platform Docker image
        uses: docker/build-push-action@v5
        with:
          build-args: |
            BASE_IMAGE=${{ env.BASE_IMAGE }}
            NODE_VERSION=${{ env.NODE_VERSION }}
            CONTAINER_NAME=${{ env.CONTAINER_NAME }}
            VERSION=${{ env.VERSION }}
            BACKEND_PORT=${{ env.BACKEND_PORT }}
            FRONTEND_PORT=${{ env.FRONTEND_PORT }}
            REPO_URL=${{ env.REPO_URL }}
            REPO_BRANCH=${{ env.REPO_BRANCH }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          context: ./Workshop-Dockers
          file: ./Workshop-Dockers/Dockerfile
          labels: ${{ steps.meta.outputs.labels }}
          platforms: linux/amd64,linux/arm64,linux/arm/v6,linux/arm/v7,linux/arm/v8
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}

name: Build and Push Multi-Platform Docker Images

on:
  pull_request:
    branches: [main, Docker]
  push:
    branches: [main, Docker]
